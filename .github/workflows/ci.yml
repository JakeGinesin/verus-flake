name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
          # NOTE: x86_64-darwin (Intel macOS) is intentionally not tested here.
          # GitHub retired the free macos-13 Intel runner on 2025-12-04, and
          # x86_64 macOS is only available on paid *-large runners. The flake
          # still supports x86_64-darwin (see the x86-macos hash); it just
          # isn't exercised in CI.
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.system }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Give Nix's own downloader more patience during flaky/degraded
          # GitHub API performance when fetching flake inputs.
          extra-conf: |
            connect-timeout = 20
            download-attempts = 5
            stalled-download-timeout = 90

      # Retry across a few minutes so transient GitHub/input-fetch blips
      # (e.g. 503s while fetching flake inputs) self-heal instead of failing
      # the run. 
      - name: Flake check and build
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            nix flake check --print-build-logs
            nix build --print-build-logs

      # Prebuilt Verus is not self-contained: at runtime its launcher shells
      # out to rustup for the exact Rust toolchain it was built against (see
      # version.json). GitHub runners ship rustup but not this specific
      # toolchain, so install it before running Verus. Read the version from
      # the build output so this keeps working after the weekly auto-update.
      - name: Install Verus's Rust toolchain
        run: |
          out=$(nix build --no-link --print-out-paths)
          tc=$(grep -oE '"toolchain"[^"]*"[^"]*"' "$out/version.json" \
                 | sed -E 's/.*"toolchain"[^"]*"([^"]*)".*/\1/')
          echo "Verus requires Rust toolchain: $tc"
          rustup install "$tc"

      - name: Smoke test
        run: nix run . -- --version
